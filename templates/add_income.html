{% extends "base.html" %}{% block title %}Add income · FinTrack{% endblock %}{% block content %}<section class="page-heading"><div><span class="eyebrow">MONEY COMING IN</span><h1>Add income</h1><p>Record salary and other income to see your complete cash flow.</p></div><a class="btn outline" href="{{ url_for('transactions') }}">Cancel</a></section><section class="form-panel"><form method="post" class="form-grid"><label class="span-two">Income name<input name="title" maxlength="120" placeholder="e.g. Monthly salary" required autofocus></label><label>Amount (₹)<input name="amount" type="number" min="0.01" step="0.01" placeholder="0.00" required></label><label>Date received<input name="date" type="date" value="{{ today }}" required></label><label>Source<select name="source"><option>Salary</option><option>Freelance</option><option>Business</option><option>Investment</option><option>Gift</option><option>Other</option></select></label><label class="span-two">Note (optional)<textarea name="note" rows="3" maxlength="500"></textarea></label><div class="form-actions span-two"><a class="text-link" href="{{ url_for('transactions') }}">Cancel</a><button class="btn primary" type="submit">Save income</button></div></form></section>{% endblock %}
