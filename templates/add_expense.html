{% extends "base.html" %}{% block title %}Add expense · FinTrack{% endblock %}{% block content %}<section class="page-heading"><div><span class="eyebrow">TRACK YOUR SPENDING</span><h1>Add an expense</h1><p>Capture the details now; use them later to understand your habits.</p></div><a class="btn outline" href="{{ url_for('transactions') }}">Cancel</a></section><section class="form-panel"><form method="post" class="form-grid"><label class="span-two">What did you spend on?<input name="title" maxlength="120" placeholder="e.g. Weekly groceries" required autofocus></label><label>Amount (₹)<input name="amount" type="number" min="0.01" step="0.01" placeholder="0.00" required></label><label>Date<input name="date" type="date" value="{{ today }}" required></label><label>Category<select name="category" required>{% for cat in categories %}<option value="{{ cat }}">{{ cat }}</option>{% endfor %}</select></label><label>Payment method<select name="payment_mode">{% for mode in payment_modes %}<option>{{ mode }}</option>{% endfor %}</select></label><fieldset class="span-two"><legend>Is this expense essential?</legend><label class="radio-card"><input type="radio" name="priority" value="Essential" checked><span><b>Essential</b><small>Needs such as rent, groceries, utilities or healthcare</small></span></label><label class="radio-card"><input type="radio" name="priority" value="Non-essential"><span><b>Non-essential</b><small>Wants, entertainment and discretionary purchases</small></span></label></fieldset><label class="span-two">Note (optional)<textarea name="note" rows="3" maxlength="500" placeholder="Add context for your future self"></textarea></label><div class="form-actions span-two"><a class="text-link" href="{{ url_for('transactions') }}">Cancel</a><button class="btn primary" type="submit">Save expense</button></div></form></section>{% endblock %}
